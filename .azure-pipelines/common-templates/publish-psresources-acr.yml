parameters:
  - name: AzureSubscription
    type: string
  - name: Registry
    type: string
  - name: RegistryName
    type: string

steps:
  - task: PowerShell@2
    displayName: 'Diagnose ACR network access'
    continueOnError: true
    inputs:
      targetType: Inline
      pwsh: true
      script: |
        $ErrorActionPreference = 'Stop'
        $registryHost = '${{ parameters.Registry }}'
        $registryUri = "https://$registryHost/v2/"

        Write-Host "Resolving $registryHost."
        $dnsRecords = Resolve-DnsName -Name $registryHost
        $dnsOutput = $dnsRecords |
          Select-Object Name, Type, IPAddress, NameHost |
          Format-Table -AutoSize |
          Out-String
        Write-Host $dnsOutput

        Write-Host "Testing TCP connectivity to ${registryHost}:443."
        $connection = Test-NetConnection -ComputerName $registryHost -Port 443 -InformationLevel Detailed
        $connectionOutput = $connection |
          Select-Object ComputerName, RemoteAddress, RemotePort, InterfaceAlias, SourceAddress, TcpTestSucceeded |
          Format-List |
          Out-String
        Write-Host $connectionOutput
        if (-not $connection.TcpTestSucceeded) {
          throw "The build agent can't establish a TCP connection to ${registryHost}:443."
        }

        Write-Host "Requesting $registryUri. An HTTP 401 response confirms that the ACR endpoint is reachable."
        $response = Invoke-WebRequest -Uri $registryUri -Method Get -SkipHttpErrorCheck -TimeoutSec 30
        Write-Host "ACR endpoint returned HTTP $([int]$response.StatusCode) $($response.StatusDescription)."

  - task: AzurePowerShell@5
    displayName: 'Publish PowerShell packages to ACR'
    inputs:
      azureSubscription: ${{ parameters.AzureSubscription }}
      ScriptType: InlineScript
      azurePowerShellVersion: LatestVersion
      pwsh: true
      Inline: |
        $ErrorActionPreference = 'Stop'
        $minimumPsResourceGetVersion = [version]'1.1.1'
        $installedModule = Get-Module -ListAvailable -Name Microsoft.PowerShell.PSResourceGet |
          Where-Object Version -GE $minimumPsResourceGetVersion |
          Sort-Object Version -Descending |
          Select-Object -First 1

        if ($null -eq $installedModule) {
          Install-Module -Name Microsoft.PowerShell.PSResourceGet -MinimumVersion $minimumPsResourceGetVersion -Scope CurrentUser -Force -AllowClobber
        }
        Import-Module Microsoft.PowerShell.PSResourceGet -MinimumVersion $minimumPsResourceGetVersion -Force

        $repositoryName = '${{ parameters.RegistryName }}'
        $existingRepository = Get-PSResourceRepository -Name $repositoryName -ErrorAction SilentlyContinue
        if ($null -ne $existingRepository) {
          Unregister-PSResourceRepository -Name $repositoryName
        }
        Register-PSResourceRepository -Name $repositoryName -Uri 'https://${{ parameters.Registry }}'

        Add-Type -AssemblyName System.IO.Compression.FileSystem
        function Get-PackageMetadata {
          param([Parameter(Mandatory)][string] $PackagePath)

          $archive = [System.IO.Compression.ZipFile]::OpenRead($PackagePath)
          try {
            $nuspecEntry = $archive.Entries | Where-Object FullName -Like '*.nuspec' | Select-Object -First 1
            if ($null -eq $nuspecEntry) {
              throw "Package '$PackagePath' doesn't contain a nuspec file."
            }

            $reader = [System.IO.StreamReader]::new($nuspecEntry.Open())
            try {
              [xml] $nuspec = $reader.ReadToEnd()
            }
            finally {
              $reader.Dispose()
            }

            return [pscustomobject]@{
              Id = [string]$nuspec.package.metadata.id
              Version = [string]$nuspec.package.metadata.version
              Path = $PackagePath
            }
          }
          finally {
            $archive.Dispose()
          }
        }

        $artifactPath = '$(System.DefaultWorkingDirectory)/drop'
        $packages = @(Get-ChildItem -Path $artifactPath -Recurse -File -Filter 'Microsoft.Graph*.nupkg' |
          ForEach-Object { Get-PackageMetadata -PackagePath $_.FullName })
        if ($packages.Count -eq 0) {
          throw "No Microsoft Graph PowerShell packages were found under '$artifactPath'."
        }

        $packages = $packages | Sort-Object @{
          Expression = {
            if ($_.Id -eq 'Microsoft.Graph.Authentication') { 0 }
            elseif ($_.Id -in @('Microsoft.Graph', 'Microsoft.Graph.Beta')) { 2 }
            else { 1 }
          }
        }, Id

        $prefix = 'public/psresource'
        foreach ($package in $packages) {
          $acrRepository = "$prefix/$($package.Id.ToLowerInvariant())"
          $existingTag = Get-AzContainerRegistryTag -RegistryName $repositoryName -RepositoryName $acrRepository -Name $package.Version -ErrorAction SilentlyContinue
          if ($null -ne $existingTag) {
            Write-Host "$($package.Id) $($package.Version) already exists in $repositoryName; continuing the idempotent deployment."
            continue
          }

          Write-Host "Publishing $($package.Id) $($package.Version) to $repositoryName."
          Publish-PSResource -NupkgPath $package.Path -Repository $repositoryName -ModulePrefix $prefix -ErrorAction Stop
        }

        foreach ($package in $packages) {
          $acrRepository = "$prefix/$($package.Id.ToLowerInvariant())"
          $publishedTag = $null
          for ($attempt = 1; $attempt -le 6 -and $null -eq $publishedTag; $attempt++) {
            $publishedTag = Get-AzContainerRegistryTag -RegistryName $repositoryName -RepositoryName $acrRepository -Name $package.Version -ErrorAction SilentlyContinue
            if ($null -eq $publishedTag -and $attempt -lt 6) {
              Start-Sleep -Seconds 10
            }
          }
          if ($null -eq $publishedTag) {
            throw "Published package '$($package.Id)' version '$($package.Version)' couldn't be found at '$acrRepository' in ACR."
          }
        }
