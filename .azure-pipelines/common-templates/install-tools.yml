steps:
  - task: UseDotNet@2
    displayName: Use .NET SDK
    retryCountOnTaskFailure: 2
    inputs:
      version: 8.x 

  - task: UseDotNet@2
    displayName: Use .NET SDK
    retryCountOnTaskFailure: 2
    inputs:
      version: 6.x 
      
  - task: NuGetToolInstaller@1
    displayName: Install Nuget

  - task: NuGetAuthenticate@1

  - task: PowerShell@2
    displayName: Version Check
    inputs:
      targetType: inline
      pwsh: true
      script: |
        Write-Output $PSVersionTable

  - task: NodeTool@0
    displayName: Install NodeJs
    retryCountOnTaskFailure: 2
    inputs:
      versionSpec: 18.x

  - task: PowerShell@2
    displayName: Configure private npm feed
    inputs:
      targetType: filePath
      pwsh: true
      filePath: $(Build.SourcesDirectory)/tools/Configure-PrivateNpmFeed.ps1
      arguments: -SourcesDirectory "$(Build.SourcesDirectory)"

  - task: npmAuthenticate@0
    displayName: Authenticate to private npm feed
    inputs:
      workingFile: $(Build.SourcesDirectory)/.npmrc

  - task: npmAuthenticate@0
    displayName: Authenticate to private npm feed (Rush)
    inputs:
      workingFile: $(Build.SourcesDirectory)/autorest.powershell/common/config/rush/.npmrc

  - task: PowerShell@2
    displayName: Apply npm auth config to user profile
    inputs:
      targetType: inline
      pwsh: true
      script: |
        # Copy authenticated .npmrc to the user home dir so ALL npm subprocesses
        # (including autorest's internal npm calls) use the private feed + auth tokens.
        $src = "$(Build.SourcesDirectory)/.npmrc"
        $dst = Join-Path $env:USERPROFILE ".npmrc"
        Copy-Item -Path $src -Destination $dst -Force
        Write-Host "Copied npm config to $dst"

  - task: PowerShell@2
    displayName: Register private module feed (CFSClean)
    inputs:
      targetType: inline
      pwsh: true
      errorActionPreference: continue
      script: |
        # Register the private Azure Artifacts feed (PowerShell Gallery upstream) as a Trusted
        # PSRepository so generation-time Install-Module/Find-Module resolve through it instead of
        # the public PowerShell Gallery. Persisted for the job (visible to later steps + runspaces).
        # errorActionPreference is 'continue' because PackageManagement emits benign non-terminating
        # errors (e.g. source-already-registered) that would otherwise fail the task; Register-CfsFeed
        # throws on genuine failure, which still fails the step.
        . "$(Build.SourcesDirectory)/tools/Get-CfsFeedCredential.ps1"
        Initialize-CfsPackageProvider
        Register-CfsFeed
        Unregister-PublicPSGallery
        Get-PSRepository | Format-List Name, SourceLocation, InstallationPolicy, Trusted
        # PowerShellGet bootstraps the NuGet provider via a native tool during registration, which can
        # leave a stray non-zero $LASTEXITCODE that fails the task even though registration succeeded.
        # Register-CfsFeed throws on genuine failure (halting before this line), so reset it here.
        $global:LASTEXITCODE = 0
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - task: PowerShell@2
    displayName: Pre-install generation tooling modules (CFSClean)
    inputs:
      targetType: inline
      pwsh: true
      errorActionPreference: continue
      script: |
        # Install PlatyPS / Pester / powershell-yaml / PowerHTML from the private feed up-front, in this
        # controlled credential context, so the lazy Install-Module calls during generation are skipped
        # by their Get-Module -ListAvailable guards (authenticated private-feed installs are fragile in
        # the parallel generation runspaces).
        . "$(Build.SourcesDirectory)/tools/Get-CfsFeedCredential.ps1"
        Install-CfsToolingModules
        Get-Module -ListAvailable -Name PlatyPS, Pester, powershell-yaml, PowerHTML | Format-Table Name, Version, Path -AutoSize
        $global:LASTEXITCODE = 0
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - task: Npm@1
    displayName: Install AutoRest
    retryCountOnTaskFailure: 2
    inputs:
      command: custom
      workingDir: $(Build.SourcesDirectory)
      customCommand: install --no-package-lock autorest@3.7.2

  - task: Npm@1
    displayName: Install AutorestCore
    retryCountOnTaskFailure: 2
    inputs:
      command: custom
      workingDir: $(Build.SourcesDirectory)
      customCommand: install --no-package-lock @autorest/core@3.10.4

  - task: PowerShell@2
    displayName: Pre-populate autorest extension cache
    inputs:
      targetType: filePath
      pwsh: true
      filePath: $(Build.SourcesDirectory)/tools/utilities/PrePopulateAutorestCache.ps1

  - task: Npm@1
    displayName: Install Rush
    retryCountOnTaskFailure: 2
    inputs:
      command: custom
      workingDir: $(Build.SourcesDirectory)
      customCommand: install --no-package-lock @microsoft/rush
  
  - task: PowerShell@2
    displayName: Rush Build
    inputs:
      targetType: inline
      pwsh: true
      workingDirectory: "autorest.powershell"
      script: |
        # Belt-and-suspenders for 1ES network isolation (CFSClean): force npm_config_registry to
        # the authenticated private feed so Rush's self-install of its own toolchain (the Rush and
        # pnpm packages it downloads into ~/.rush via `npm install`) resolves from the private feed
        # instead of defaulting to registry.npmjs.org. The env var is the highest-precedence npm
        # config source and is inherited by every child process, so it covers the self-install npm
        # calls that do not pick up the transformed common/config/rush/.npmrc.
        if (-not $env:npm_config_registry) {
            $userNpmrc = Join-Path $env:USERPROFILE ".npmrc"
            if (Test-Path $userNpmrc) {
                $regLine = Select-String -Path $userNpmrc -Pattern '^registry=' | Select-Object -First 1
                if ($regLine) { $env:npm_config_registry = ($regLine.Line -replace '^registry=', '').Trim() }
            }
        }
        Write-Host "npm_config_registry = $env:npm_config_registry"

        # Point the .pnpmfile.cjs tarball rewrite at the private feed. The pnpmfile only rewrites
        # the tarball URLs of its version-override packages (serialize-javascript, js-yaml) when
        # this env var is present, and uses its value as the replacement registry base. The feed
        # emits public registry.npmjs.org tarball URLs for those overridden versions, which would
        # otherwise be fetched directly from public npm (blocked under 1ES/CFSClean isolation).
        # Setting it to $env:npm_config_registry keeps the destination tied to the same feed the
        # pipeline authenticated against. Leaving it unset disables the rewrite (local dev).
        $env:MG_PNPM_TARBALL_REGISTRY = $env:npm_config_registry
        Write-Host "MG_PNPM_TARBALL_REGISTRY = $env:MG_PNPM_TARBALL_REGISTRY"

        npx --no-install rush install
        if ($LASTEXITCODE -ne 0) { throw "rush install failed with exit code $LASTEXITCODE" }
        npx --no-install rush link
        if ($LASTEXITCODE -ne 0) { throw "rush link failed with exit code $LASTEXITCODE" }
        npx --no-install rush rebuild
        if ($LASTEXITCODE -ne 0) { throw "rush rebuild failed with exit code $LASTEXITCODE" }