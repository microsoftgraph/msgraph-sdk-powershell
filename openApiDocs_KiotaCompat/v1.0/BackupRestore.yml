      title: browseSessionStatus
      enum:
        - creating
        - created
        - failed
        - unknownFutureValue
      type: string
    microsoft.graph.browseQueryResponseItemType:
      title: browseQueryResponseItemType
      enum:
        - none
        - site
        - documentLibrary
        - folder
        - file
        - unknownFutureValue
      type: string
    microsoft.graph.protectionRuleBase:
      allOf:
        - $ref: '#/components/schemas/microsoft.graph.entity'
        - title: protectionRuleBase
          required:
            - '@odata.type'
          type: object
          properties:
            createdBy:
              anyOf:
                - $ref: '#/components/schemas/microsoft.graph.identitySet'
                - type: object
                  nullable: true
              description: The identity of person who created the rule.
            createdDateTime:
              pattern: '^[0-9]{4,}-(0[1-9]|1[012])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]([.][0-9]{1,12})?(Z|[+-][0-9][0-9]:[0-9][0-9])$'
              type: string
              description: The time of creation of the rule.
              format: date-time
              nullable: true
            error:
              anyOf:
                - $ref: '#/components/schemas/microsoft.graph.publicError'
                - type: object
                  nullable: true
              description: Contains error details if an operation on a rule fails.
            isAutoApplyEnabled:
              type: boolean
              description: true indicates that the protection rule is dynamic; false that it's static.
              nullable: true
            lastModifiedBy:
              anyOf:
                - $ref: '#/components/schemas/microsoft.graph.identitySet'
                - type: object
                  nullable: true
              description: The identity of the person who last modified the rule.
            lastModifiedDateTime:
              pattern: '^[0-9]{4,}-(0[1-9]|1[012])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]([.][0-9]{1,12})?(Z|[+-][0-9][0-9]:[0-9][0-9])$'
              type: string
              description: Timestamp of the last modification made to the rule.
              format: date-time
